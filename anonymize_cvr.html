				{

					cursor = nextDelim + delimLen;
					// we look for next delimiter char
					nextDelim = input.indexOf(delim, cursor);
					continue;
				}

				// End of row
				if (nextNewline !== -1)
				{
					row.push(input.substring(cursor, nextNewline));
					saveRow(nextNewline + newlineLen);

					if (stepIsFunction)
					{

							return returnable();

					if (preview && data.length >= preview)

			return finish();


			function pushRow(row)
			{

			/**

             * if Yes, returns the number of spaces
             */
			function extraSpaces(index) {
				var spaceLength = 0;
				if (index !== -1) {
					var textBetweenClosingQuoteAndIndex = input.substring(quoteSearch + 1, index);
					if (textBetweenClosingQuoteAndIndex && textBetweenClosingQuoteAndIndex.trim() === '') {

			}

			 * row, saves the row, calls step, and returns the results.
			 */

			{

			/**

			 * to newCursor and finds the nextNewline. The caller should
			 * take care to execute user's step function and check for
			 * preview and end parsing if necessary.

			{
				cursor = newCursor;
				pushRow(row);
				row = [];
				nextNewline = input.indexOf(newline, cursor);

			function returnable(stopped)
			{
				return {
					data: data,
					errors: errors,
					meta: {

						linebreak: newline,

						truncated: !!stopped,
						cursor: lastCursor + (baseIndex || 0)

			}

			function doStep()

				step(returnable());

<body>

<h1>CVR Anonymizer</h1>
<p class="subtitle">Anonymizes Cast Vote Records per Colorado C.R.S. 24-72-205.5.
Runs entirely in your browser — no file is uploaded to any server.</p>

<div class="options">
    <label>
        <input type="checkbox" id="redactOnPrecinct">
        Redact on precinct &mdash; treat rare (style, precinct) combinations as rare styles
    </label>
    <label>
        <input type="checkbox" id="noContestBalancing">
        Skip contest balancing (not recommended) &mdash; can reveal votes in contests that
        only a few rare ballots carry
    </label>
    <label>
        <input type="checkbox" id="keepRareContests">
        Keep rare contests (not recommended) &mdash; do not redact contests present on fewer
        than the minimum cards
    </label>
    <label>
        <input type="checkbox" id="dropBallotType">
        Drop the BallotType column &mdash; ballots with a rare label are otherwise grouped as
        rare ballots; this drops the label from the CVR instead (not from ballot images)
    </label>
    <label>
        Minimum ballots per style:
        <input type="number" id="minBallots" value="10" min="1">
    </label>
</div>

<div class="file-row">
    <input type="file" id="fileInput" accept=".csv">
</div>

<button id="runBtn" disabled>Anonymize CVR...</button>

<pre id="status"></pre>

<script>
// ============================================================
// Constants (mirror anonymize_cvr.py)
// ============================================================
const MIN_BALLOTS_DEFAULT = 10;
const NEAR_UNANIMOUS_THRESHOLD = 2;
const MIN_CONTRASTING_VOTES = 3;
const COVERAGE_WEIGHT = 10.0;
const DONOR_SURPLUS_THRESHOLD = 3;
const VERSION = '0.3';   // keep in step with VERSION in anonymize_cvr.py
const OUR_VERSION = 'anonymize_cvr-v' + VERSION;

// ============================================================
// CSV helpers
// ============================================================

function isEmptyRow(row) {
    return !row.some(v => (v || '').trim() !== '');
}

// Serialize one row to a CSV line (no trailing newline).
function serializeRow(row) {
    return row.map(cell => {
        const s = (cell === null || cell === undefined) ? '' : String(cell);
        if (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\r')) {
            return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
    }).join(',');
}

// Parse one CSV line into an array of field strings.
// Handles quoted fields (including escaped quotes "").
function parseCsvRow(line) {
    const result = [];
    let current = '';
    let inQuote = false;

    for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuote) {
            if (ch === '"') {
                if (i + 1 < line.length && line[i + 1] === '"') {
                    current += '"';
                    i++;
                } else {
                    inQuote = false;
                }
            } else {
                current += ch;
            }
        } else {
            if (ch === '"') {
                inQuote = true;
            } else if (ch === ',') {
                result.push(current);
                current = '';
            } else {
                current += ch;
            }
        }
    }
    result.push(current);
    return result;
}

// Return a new row with the columns in colsToRemoveSet omitted.
function removeColumns(row, colsToRemoveSet) {
    return row.filter((_, i) => !colsToRemoveSet.has(i));
}

// ============================================================
// buildDatabase — parse the four CVR header rows
// ============================================================
function buildDatabase(headerRows) {
    const [versionRow, contestsRow, choicesRow, headersRow] = headerRows;

    let headerlen = 0;
    for (const cell of contestsRow) {
        if (cell.trim() === '') { headerlen++; } else { break; }
    }
    if (headerlen === 0) {
        throw new Error(
            'Could not auto-detect headerlen: no empty cells at the start of the contests row.'
        );
    }

    let ballotTypeIdx = null, precinctPortionIdx = null, countingGroupIdx = null;
    for (let idx = 0; idx < headersRow.length; idx++) {
        const lower = headersRow[idx].trim().toLowerCase();
        if      (lower === 'ballottype')      ballotTypeIdx      = idx;
        else if (lower === 'precinctportion') precinctPortionIdx = idx;
        else if (lower === 'countinggroup')   countingGroupIdx   = idx;
    }

    const contestNames    = [];
    const contestToColumns  = {};
    const contestChoiceMeta = {};

    for (let colIdx = headerlen; colIdx < contestsRow.length; colIdx++) {
        const name = contestsRow[colIdx].trim();
        if (!name) throw new Error(`Contest row column ${colIdx} is empty; expected a contest name.`);
        if (!(name in contestToColumns)) {
            contestNames.push(name);
            contestToColumns[name]  = [];
            contestChoiceMeta[name] = {};
        }
        contestToColumns[name].push(colIdx);
        const choiceName = colIdx < choicesRow.length ? choicesRow[colIdx].trim() : '';
        contestChoiceMeta[name][colIdx] = choiceName || ('Choice' + colIdx);
    }

    return {
        headerlen,
        numCols: contestsRow.length,
        numVoteCols: contestsRow.length - headerlen,
        ballotTypeIdx,
        precinctPortionIdx,
        countingGroupIdx,
        contestNames,
        contestToColumns,
        contestChoiceMeta,
        // Contests too rare to protect, set aside by setAsideContests().
        setAsideContestNames: [],
        setAsideColumns: [],
    };
}

// ============================================================
// computeStyle — binary string of '1'/'0' per contest
// ============================================================
function computeStyle(row, db) {
    let style = '';
    for (const contestName of db.contestNames) {
        let present = false;
        for (const colIdx of db.contestToColumns[contestName]) {
            if ((row[colIdx] || '').trim() !== '') { present = true; break; }
        }
        style += present ? '1' : '0';
    }
    return style;
}

function shouldSkipRow(row, db) {
    for (let colIdx = db.headerlen; colIdx < row.length; colIdx++) {
        if ((row[colIdx] || '').trim() === '*') return true;
    }
    if (db.ballotTypeIdx !== null &&
        (row[db.ballotTypeIdx] || '').trim() === 'AGGREGATED') return true;
    if ((row[0] || '').trim() === 'AGGREGATED') return true;
    return false;
}

function makeIndex(styleIdForRow, styleStrings, rowsByPrivacyUnit, rowsByBallotType) {
    return {
        styleIdForRow, styleStrings, rowsByPrivacyUnit, rowsByBallotType,
        skippedBallotTypeCounts: new Map(),
        // Ballots made rare by a rare label: row index -> their privacy unit key.
        labelUnitForRow: new Map(),
        puKeyForRow(rowIdx, style, precinct) {
            return this.labelUnitForRow.get(rowIdx) || (style + '|' + precinct);
        },
        // Reads this.* (not the arguments) because setAsideRareContests
        // replaces the style tables.
        styleForRow(rowIdx) {
            const id = this.styleIdForRow[rowIdx];
            return id === null ? null : this.styleStrings[id];
        },
        parsePuKey(key) {
            const pipe = key.indexOf('|');
            return { style: key.substring(0, pipe), precinct: key.substring(pipe + 1) };
        },
    };
}

// ============================================================
// Pass 1: stream the file to build db + index.
// Only stores integers (row indices), not row data.
// Returns: { db, headerRows, index }
// ============================================================
function pass1BuildDbAndIndex(file, redactOnPrecinct, log) {
    return new Promise((resolve, reject) => {
        const headerRows = [];
        let db = null;

        const styleIdForRow     = [];
        const styleStrings      = [];
        const styleTable        = {};
        const rowsByPrivacyUnit = new Map();
        const rowsByBallotType  = new Map();
        const skippedBallotTypeCounts = new Map();

        let fileRowCount = 0;
        let ballotRowIdx = 0;

        Papa.parse(file, {
            skipEmptyLines: false,
            step: function(result) {
                const row = result.data;
                fileRowCount++;

                if (fileRowCount <= 4) {
                    headerRows.push(row);
                    if (fileRowCount === 4) db = buildDatabase(headerRows);
                    return;
                }
                if (isEmptyRow(row)) return;

                const currentIdx = ballotRowIdx++;
                if (ballotRowIdx % 100000 === 0)
                    log('  ' + ballotRowIdx.toLocaleString() + ' rows scanned (pass 1)...');

                if (shouldSkipRow(row, db)) {
                    styleIdForRow.push(null);
                    // Rows already redacted still carry their label in the file.
                    if (db.ballotTypeIdx !== null) {
                        const bt = (row[db.ballotTypeIdx] || '').trim();
                        skippedBallotTypeCounts.set(bt, (skippedBallotTypeCounts.get(bt) || 0) + 1);
                    }
                    return;
                }
                // County pre-redacted rows: all vote columns blank.  Nothing to
                // analyse or anonymize; pass through unchanged.
                if (row.slice(db.headerlen).every(v => (v || '').trim() === '')) {
                    styleIdForRow.push(null);
                    return;
                }

                const styleStr = computeStyle(row, db);
                if (!(styleStr in styleTable)) {
                    styleTable[styleStr] = styleStrings.length;
                    styleStrings.push(styleStr);
                }
                styleIdForRow.push(styleTable[styleStr]);

                const precinct = (redactOnPrecinct && db.precinctPortionIdx !== null)
                    ? (row[db.precinctPortionIdx] || '').trim() : '';
                const puKey = styleStr + '|' + precinct;
                if (!rowsByPrivacyUnit.has(puKey)) rowsByPrivacyUnit.set(puKey, []);
                rowsByPrivacyUnit.get(puKey).push(currentIdx);

                if (db.ballotTypeIdx !== null) {
                    const bt = (row[db.ballotTypeIdx] || '').trim();
                    if (bt) {
                        if (!rowsByBallotType.has(bt)) rowsByBallotType.set(bt, []);
                        rowsByBallotType.get(bt).push(currentIdx);
                    }
                }
            },
            complete: function() {
                const index = makeIndex(styleIdForRow, styleStrings,
                                        rowsByPrivacyUnit, rowsByBallotType);
                index.skippedBallotTypeCounts = skippedBallotTypeCounts;
                resolve({ db, headerRows, index });
            },
            error: reject,
        });
    });
}

// ============================================================
// Contests and labels too rare to protect (mirror anonymize_cvr.py)
// ============================================================

// { contest name: number of cards it is present on }, in contest order,
// computed from the pass-1 style strings with no further read of the file.
function contestCardCounts(index, db) {
    const counts = new Map();
    for (const name of db.contestNames) counts.set(name, 0);
    for (const [puKey, rowIndices] of index.rowsByPrivacyUnit) {
        const { style } = index.parsePuKey(puKey);
        for (let i = 0; i < db.contestNames.length; i++)
            if (style[i] === '1')
                counts.set(db.contestNames[i], counts.get(db.contestNames[i]) + rowIndices.length);
    }
    return counts;
}

// Contests present on more than 0 and fewer than minBallots cards: no aggregate
// can protect them.  Returns a Map { name: card count } in contest order.
function rareContests(index, db, minBallots) {
    const result = new Map();
    for (const [name, count] of contestCardCounts(index, db))
        if (count > 0 && count < minBallots) result.set(name, count);
    return result;
}

// Take the named contests out of db's contest tables, recording them and
// their columns in db.setAsideContestNames / db.setAsideColumns.
function setAsideContests(db, names) {
    for (const name of db.contestNames) {
        if (!names.has(name)) continue;
        db.setAsideContestNames.push(name);
        db.setAsideColumns.push(...db.contestToColumns[name]);
    }
    db.setAsideColumns.sort((a, b) => a - b);
    db.contestNames = db.contestNames.filter(n => !names.has(n));
    for (const name of names) {
        delete db.contestToColumns[name];
        delete db.contestChoiceMeta[name];
    }
}

// Recompute the pass-1 styles as if the named contests had never been in the
// file (drop their positions, merge styles that become identical), then hide
// them in db.  In memory; the file is not read again.
function setAsideRareContests(index, db, names) {
    const keep = [];
    for (let i = 0; i < db.contestNames.length; i++)
        if (!names.has(db.contestNames[i])) keep.push(i);
    const strip = style => keep.map(i => style[i]).join('');

    const newStrings = [], newIdForString = new Map(), newIdForOld = [];
    for (const oldStyle of index.styleStrings) {
        const ns = strip(oldStyle);
        if (!newIdForString.has(ns)) {
            newIdForString.set(ns, newStrings.length);
            newStrings.push(ns);
        }
        newIdForOld.push(newIdForString.get(ns));
    }
    index.styleIdForRow = index.styleIdForRow.map(id => id === null ? null : newIdForOld[id]);

    const merged = new Map();
    for (const [puKey, rowIndices] of index.rowsByPrivacyUnit) {
        const { style, precinct } = index.parsePuKey(puKey);
        const key = strip(style) + '|' + precinct;
        if (!merged.has(key)) merged.set(key, []);
        merged.get(key).push(...rowIndices);
    }
    for (const rows of merged.values()) rows.sort((a, b) => a - b);

    index.styleStrings = newStrings;
    index.rowsByPrivacyUnit = merged;
    setAsideContests(db, names);
}

// { label: ballot count } for every non-empty label carried by fewer than
// minBallots ballots, at least one of them with visible votes, sorted by label.
// The count includes rows already redacted, which still carry the label.
function rareLabels(rowsByLabel, skippedCounts, minBallots) {
    const result = new Map();
    for (const label of [...rowsByLabel.keys()].sort()) {
        const rows = rowsByLabel.get(label);
        const n = rows.length + (skippedCounts.get(label) || 0);
        if (label && rows.length > 0 && n < minBallots) result.set(label, n);
    }
    return result;
}

// Separates the precinct from a rare label in a privacy-unit key.
const LABEL_UNIT_SEP = '\u0000';

// Move every ballot carrying a rare label into a privacy unit of its own
// (style, precinct and label), so it is rare and is grouped into the aggregate.
// What remains of a unit stays in it.  Mirrors make_rare_label_rows_rare().
function makeRareLabelRowsRare(index, description, labels, rowsByLabel) {
    const tagForRow = new Map();
    for (const label of labels.keys())
        for (const rowIdx of rowsByLabel.get(label) || [])

    if (tagForRow.size === 0) return 0;

    const remaining = new Map(), moved = new Map();
    for (const [puKey, rowIndices] of index.rowsByPrivacyUnit) {
        const keep = [];
        for (const rowIdx of rowIndices) {
            const tag = tagForRow.get(rowIdx);
            if (tag === undefined) { keep.push(rowIdx); continue; }
            const key = puKey + LABEL_UNIT_SEP + tag;
            if (!moved.has(key)) moved.set(key, []);
            moved.get(key).push(rowIdx);
            index.labelUnitForRow.set(rowIdx, key);
        }
        if (keep.length > 0) remaining.set(puKey, keep);
    }
    for (const [k, v] of moved) remaining.set(k, v);
    index.rowsByPrivacyUnit = remaining;
    return tagForRow.size;
}

// Follows "Dropping the column protects only the CVR." or "Grouping these
// ballots protects only the CVR.", whichever remedy applies.
const IMAGE_WARNING_LABELS =
    'The same label is often printed ' +
    'on the ballot itself (a ballot-style code, a precinct number), so any ballot ' +
    'images the county releases carry it too, and a rare label on an image ' +
    'identifies the ballot just as it would in the CVR.  The county must redact ' +
    'the label on those images as well, or better, stop printing a label that a ' +
    'few ballots alone carry.';

const IMAGE_WARNING_CONTESTS =
    'This protects only the CVR.  An image of one of these ballots shows the ' +
    'contest and the marks in it; the county must redact the contest on any ' +
    'ballot images it releases as well.';

// ============================================================
// checkRedactionNeeds
// ============================================================
function checkRedactionNeeds(index, db, minBallots) {
    const rarePairs        = new Map();
    const leakageWarnings  = [];

    for (const [puKey, rowIndices] of index.rowsByPrivacyUnit) {
        if (rowIndices.length < minBallots) rarePairs.set(puKey, rowIndices.length);
    }

    if (db.ballotTypeIdx !== null) {
        const btByStyle = {};
        for (const [bt, rowIndices] of index.rowsByBallotType) {
            for (const rowIdx of rowIndices) {
                const style = index.styleForRow(rowIdx);
                if (style === null) continue;
                if (!btByStyle[style]) btByStyle[style] = new Set();
                btByStyle[style].add(bt);
            }
        }
        for (const [style, types] of Object.entries(btByStyle)) {
            if (types.size > 1) {
                leakageWarnings.push(
                    'Leakage: ballot types [' + Array.from(types).sort().join(', ') +
                    '] all share the same contest pattern'
                );
            }
        }
    }

    return {
        rarePairs, leakageWarnings,
        rareContests: new Map(),   // filled in by the caller (Feature A)
        needsAggregate() { return rarePairs.size > 0; },
        rareLabels: new Map(),     // filled in by the caller (Feature B)
        needsRedaction() {
            return rarePairs.size > 0 || this.rareContests.size > 0 || this.rareLabels.size > 0;
        },
    };
}

// ============================================================
// Aggregate — tracks the anonymized pool (Rules a, b, c)
// ============================================================
class Aggregate {
    constructor(initialBallots, rareContests, db, minBallots) {
        this.db = db;
        this.minBallots = minBallots;
        this.rareContests = rareContests;
        this.ballots = [];
        this.rowIdxSet = new Set();
        this.contestBallotCounts = {};
        this.contestChoiceCounts = {};

        for (const name of db.contestNames) {
            this.contestBallotCounts[name] = 0;
            this.contestChoiceCounts[name] = {};
        }
        for (const item of initialBallots) this.add(item.rowIdx, item.row);
    }

    add(rowIdx, row) {
        this.ballots.push({ rowIdx, row });
        this.rowIdxSet.add(rowIdx);

        for (const [contestName, colIndices] of Object.entries(this.db.contestToColumns)) {
            if (colIndices.some(ci => (row[ci] || '').trim() !== ''))
                this.contestBallotCounts[contestName]++;
        }

        for (const [contestName, colMap] of Object.entries(this.db.contestChoiceMeta)) {
            for (const [colIdxStr, choiceName] of Object.entries(colMap)) {
                const val = (row[parseInt(colIdxStr)] || '').trim();
                if (!val || val === '0') continue;
                const inc = isNaN(parseFloat(val)) ? 1 : parseFloat(val);
                const c = this.contestChoiceCounts[contestName];
                c[choiceName] = (c[choiceName] || 0) + inc;
            }
        }
    }

    containsRow(rowIdx)     { return this.rowIdxSet.has(rowIdx); }
    totalCount()            { return this.ballots.length; }
    needsMoreTotalBallots() { return this.ballots.length < this.minBallots; }
    choiceCounts()          { return this.contestChoiceCounts; }

    contestsNeedingBallots() {
        const result = {};
        for (const contest of this.rareContests) {
            const count = this.contestBallotCounts[contest] || 0;
            if (count < this.minBallots) result[contest] = this.minBallots - count;
        }
        return result;
    }

    satisfiesMinimums() {
        return !this.needsMoreTotalBallots() &&
               Object.keys(this.contestsNeedingBallots()).length === 0;
    }
}

// ============================================================
// CommonPool — donor ballots available for borrowing (Rule d)
// ============================================================
class CommonPool {
    constructor(donors, minBallots, rowcountByPu, blockedStyles) {
        this.donors        = new Map(donors);
        this.minBallots    = minBallots;
        this.rowcountByPu  = rowcountByPu;
        this.removedCounts = new Map();
        this.blockedStyles = new Map(blockedStyles || []);
    }

    surplus(key) {
        return (this.rowcountByPu.get(key) || 0) -
               (this.removedCounts.get(key) || 0) -
               this.minBallots;
    }

    canDonate(key) { return this.surplus(key) > 0; }
    isEmpty()      { return this.donors.size === 0; }

    remove(key, idx) {
        const rows = this.donors.get(key);
        rows.splice(idx, 1);
        this.removedCounts.set(key, (this.removedCounts.get(key) || 0) + 1);
        if (rows.length === 0 || this.surplus(key) <= 0) this.donors.delete(key);
    }

    removeRows(rowsToRemove) {
        const idxSet = new Set(rowsToRemove.map(r => r.rowIdx));
        for (const [key, rows] of this.donors) {
            const remaining   = rows.filter(r => !idxSet.has(r.rowIdx));
            const removedHere = rows.length - remaining.length;
            if (removedHere > 0)
                this.removedCounts.set(key, (this.removedCounts.get(key) || 0) + removedHere);
            if (remaining.length === 0 || this.surplus(key) <= 0) this.donors.delete(key);
            else this.donors.set(key, remaining);
        }
    }

    bestCandidateFor(aggregate, db) {
        const needed = aggregate.contestsNeedingBallots();
        if (Object.keys(needed).length > 0) return this._bestForContests(aggregate, db, needed);
        if (aggregate.needsMoreTotalBallots())  return this._anyCandidate(aggregate);
        return null;
    }

    _bestForContests(aggregate, db, needed) {
        const neededList = Object.keys(needed).filter(c => needed[c] > 0);
        let best = null, bestScore = -1;

        for (const [key, rows] of this.donors) {
            if (!this.canDonate(key)) continue;
            for (let idx = 0; idx < rows.length; idx++) {
                const { rowIdx, row } = rows[idx];
                if (aggregate.containsRow(rowIdx)) continue;
                const covered = neededList.filter(c => ballotHasContest(row, c, db.contestToColumns));
                if (covered.length === 0) continue;
                const gain  = covered.reduce(
                    (s, c) => s + imbalanceReduction(c, row, aggregate.choiceCounts(), db.contestChoiceMeta), 0);
                const score = COVERAGE_WEIGHT * covered.length + gain;
                if (score > bestScore) { bestScore = score; best = { key, idx, rowIdx, row }; }
            }
        }
        return best;
    }

    _anyCandidate(aggregate) {
        let bestKey = null, bestSurplus = 0;
        for (const key of this.donors.keys()) {
            const s = this.surplus(key);
            if (s > 0 && s > bestSurplus) { bestKey = key; bestSurplus = s; }
        }
        if (bestKey === null) return null;
        for (let idx = 0; idx < this.donors.get(bestKey).length; idx++) {
            const { rowIdx, row } = this.donors.get(bestKey)[idx];
            if (!aggregate.containsRow(rowIdx)) return { key: bestKey, idx, rowIdx, row };
        }
        return null;
    }

    // Find the blocked style (at exactly minBallots rows in the full CVR) that
    // covers the most contests still needing ballots, pull all its rows, and
    // return { key, rows }.  Returns null if no blocked style covers any needed
    // contest.
    //
    // A blocked style can't donate individual ballots without violating Rule d,
    // but pulling the entire style into the aggregate is safe: all its voters
    // become part of the aggregate, and none are left as an identifiable minority.
    pullBlockedStyleFor(neededContests, db) {
        const neededList = Object.keys(neededContests).filter(c => neededContests[c] > 0);
        if (neededList.length === 0) return null;

        let bestKey = null, bestCoverage = 0;
        for (const [key, rows] of this.blockedStyles) {
            let coverage = 0;
            for (const contest of neededList) {
                if (rows.some(({ row }) => ballotHasContest(row, contest, db.contestToColumns)))
                    coverage++;
            }
            if (coverage > bestCoverage) { bestCoverage = coverage; bestKey = key; }
        }
        if (bestKey === null) return null;
        const rows = this.blockedStyles.get(bestKey);
        this.blockedStyles.delete(bestKey);
        return { key: bestKey, rows };
    }
}

// ============================================================
// Redaction helpers
// ============================================================
function ballotHasContest(row, contest, contestToColumns) {
    return (contestToColumns[contest] || []).some(ci => (row[ci] || '').trim() !== '');
}

// Return [contest name, ballots in the aggregate that carry it], in contest
// order, for every contest that is on a rare ballot and on fewer than
// minBallots of the aggregate's ballots.  The aggregation line shows such a
// contest's totals for just those ballots, and the starred rows show which
// ballots they are.  A contest that only borrowed ballots carry is left out:
// a borrowed ballot comes from a common style and would otherwise have been
// published in full.  rareRows and aggregateBallots hold { rowIdx, row }.
function exposedContests(rareRows, aggregateBallots, db, minBallots) {
    const exposed = [];
    for (const name of db.contestNames) {
        if (!rareRows.some(b => ballotHasContest(b.row, name, db.contestToColumns)))
            continue;
        const count = aggregateBallots.filter(
            b => ballotHasContest(b.row, name, db.contestToColumns)).length;
        if (count < minBallots) exposed.push([name, count]);
    }
    return exposed;
}

// Log the contests exposedContests() found, and what that exposes.
function warnExposedContests(exposed, minBallots, noContestBalancing, log) {
    if (exposed.length === 0) return;
    log('');
    if (noContestBalancing)
        log('  WARNING: contest balancing was skipped, so these contests are on too few ' +
            'ballots in the aggregate (' + exposed.length + '):');
    else
        log('  WARNING: balancing could not find enough ballots, so these contests are on ' +
            'too few ballots in the aggregate (' + exposed.length + '):');
    for (const [name, count] of exposed)
        log("    '" + name + "': " + count + ' ballot(s)');
    log("  The aggregation line shows each contest's totals for just those ballots, and " +
        'the starred rows show which ballots they are.  A contest on 1 ballot reveals ' +
        "that ballot's vote; a contest on a few reveals their votes whenever they agree.");
    if (noContestBalancing)
        log('  Run again with "Skip contest balancing" unticked to protect them.');
    else
        log('  Fewer than ' + minBallots + ' ballots that can be borrowed carry these ' +
            'contests; consider redacting them by hand.');
}

function imbalanceReduction(contest, row, choiceCounts, contestChoiceMeta) {
    const current  = choiceCounts[contest] || {};
    const curVals  = Object.values(current);
    const curTotal = curVals.reduce((a, b) => a + b, 0);
    const curMax   = curVals.length > 0 ? Math.max(...curVals) : 0;
    const curGap   = curMax - (curTotal - curMax);

    const contributions = {};
    for (const [colIdxStr, choiceName] of Object.entries(contestChoiceMeta[contest] || {})) {
        const val = (row[parseInt(colIdxStr)] || '').trim();
        if (!val || val === '0') continue;
        contributions[choiceName] = 1;
    }
    if (Object.keys(contributions).length === 0) return 0;

    const newCounts = { ...current };
    let addedTotal = 0;
    for (const [choice, inc] of Object.entries(contributions)) {
        newCounts[choice] = (newCounts[choice] || 0) + inc;
        addedTotal += inc;
    }
    const newMax = Math.max(...Object.values(newCounts));
    return Math.max(0, curGap - (newMax - ((curTotal + addedTotal) - newMax)));
}

function buildAggregateRow(ballots, db, aggregateId) {
    if (ballots.length === 0) return [];
    const result = [...ballots[0].slice(0, db.headerlen)];
    result[0] = aggregateId;
    if (result.length > 1) result[1] = '';
    if (result.length > 2) result[2] = '';
    if (result.length > 3) result[3] = '';
    if (result.length > 4) result[4] = '';
    if (db.countingGroupIdx   !== null) result[db.countingGroupIdx]   = '';
    if (db.precinctPortionIdx !== null) result[db.precinctPortionIdx] = '';
    if (db.ballotTypeIdx      !== null) result[db.ballotTypeIdx]      = 'AGGREGATED';

    for (let colIdx = db.headerlen; colIdx < ballots[0].length; colIdx++) {
        let total = 0;
        for (const b of ballots) {
            const p = parseFloat((b[colIdx] || '').trim());
            if (!isNaN(p)) total += p;
        }
        result.push(total === Math.floor(total) ? String(Math.floor(total)) : String(total));
    }
    return result;
}

// '*' replaces every non-empty vote cell; empty cells stay empty, as in
// anonymize_cvr.py.
function redactBallotRow(row, db, redactOnPrecinct) {
    const r = [...row];
    if (db.countingGroupIdx !== null) r[db.countingGroupIdx] = '';
    if (!redactOnPrecinct && db.precinctPortionIdx !== null) r[db.precinctPortionIdx] = '';
    for (let i = db.headerlen; i < r.length; i++) if (row[i] !== '') r[i] = '*';
    return r;
}

// The aggregation line for a file that needs one only to mark set-aside
// contests "Redacted": the identifier fields an aggregation line has, and 0 in
// every vote column.  It stands for no ballots.
function addedAggregateRow(db) {
    const result = new Array(db.headerlen).fill('');
    result[0] = 'AGGREGATED';
    if (db.ballotTypeIdx !== null) result[db.ballotTypeIdx] = 'AGGREGATED';
    for (let i = db.headerlen; i < db.numCols; i++) result.push('0');
    return result;
}

function emptyColumns(row, cols) {
    if (cols.length === 0) return row;
    const r = [...row];
    for (const c of cols) r[c] = '';
    return r;
}

function blankGeographicFields(row, db, redactOnPrecinct) {
    const r = [...row];
    if (db.countingGroupIdx !== null) r[db.countingGroupIdx] = '';
    if (!redactOnPrecinct && db.precinctPortionIdx !== null) r[db.precinctPortionIdx] = '';
    return r;
}

function addToTally(tally, row, headerlen, skipCols) {
    for (let i = 0; i < tally.length; i++) {
        const colIdx = headerlen + i;
        if (colIdx >= row.length) continue;
        if (skipCols && skipCols.has(colIdx)) continue;
        const p = parseFloat((row[colIdx] || '').trim());
        if (!isNaN(p)) tally[i] += p;
    }
}

// ============================================================
// buildAggregate — Rules a and b
// ============================================================
function buildAggregate(rareBallots, rareContests, pool, db, minBallots, log) {
    const aggregate = new Aggregate(rareBallots, rareContests, db, minBallots);

    if (!aggregate.satisfiesMinimums()) {
        log('  Rare ballots: ' + aggregate.totalCount() + '.');
        log('  Borrowing from common styles to satisfy minimums...');
    }

    while (!aggregate.satisfiesMinimums()) {
        const result = pool.bestCandidateFor(aggregate, db);
        if (result === null) {
            const blocked = pool.pullBlockedStyleFor(aggregate.contestsNeedingBallots(), db);
            if (blocked !== null) {
                for (const { rowIdx, row } of blocked.rows) aggregate.add(rowIdx, row);
                continue;
            }
            for (const [contest, n] of Object.entries(aggregate.contestsNeedingBallots()))
                log("WARNING: could not find enough ballots for contest '" + contest +
                    "' (still need " + n + " more).");
            break;
        }
        aggregate.add(result.rowIdx, result.row);
        pool.remove(result.key, result.idx);
    }
    return aggregate;
}

// ============================================================
// Near-unanimity — Rule c
// ============================================================
function findNearUnanimousContests(aggregate, db) {
    const result = [];
    for (const [contestName, choiceVotes] of Object.entries(aggregate.choiceCounts())) {
        if (!aggregate.rareContests.has(contestName)) continue;
        if (Object.keys(choiceVotes).length === 0) continue;
        if ((db.contestToColumns[contestName] || []).length <= 1) continue;
        const totalVotes = Object.values(choiceVotes).reduce((a, b) => a + b, 0);
        if (totalVotes === 0) continue;
        let maxChoice = null, maxVotes = 0;
        for (const [choice, votes] of Object.entries(choiceVotes))
            if (votes > maxVotes) { maxVotes = votes; maxChoice = choice; }
        if ((totalVotes - maxVotes) <= NEAR_UNANIMOUS_THRESHOLD)
            result.push({ contestName, maxChoice, maxVotes, totalVotes });
    }
    return result;
}

function findContrastingBallots(problematic, pool, db) {
    if (problematic.length === 0) return [];
    const contestInfo = {};
    for (const { contestName, maxChoice } of problematic) {
        const colMap = db.contestChoiceMeta[contestName] || {};
        let winningCol = null;
        for (const [s, name] of Object.entries(colMap))
            if (name === maxChoice) { winningCol = parseInt(s); break; }
        contestInfo[contestName] = { colIndices: db.contestToColumns[contestName] || [], winningCol };
    }

    const ballotScores = [];
    for (const [key, rows] of pool.donors) {
        if (!pool.canDonate(key)) continue;
        for (const { rowIdx, row } of rows) {
            const satisfied = [];
            for (const { contestName } of problematic) {
                const { colIndices, winningCol } = contestInfo[contestName];
                if (!colIndices.some(ci => (row[ci] || '').trim() !== '')) continue;
                if (winningCol !== null && (row[winningCol] || '').trim() !== '1') {
                    for (const ci of colIndices)
                        if (ci !== winningCol && (row[ci] || '').trim() === '1') {
                            satisfied.push(contestName); break;
                        }
                }
            }
            if (satisfied.length > 0) ballotScores.push({ score: satisfied.length, satisfied, rowIdx, row });
        }
    }
    ballotScores.sort((a, b) => b.score - a.score);

    const contestsNeeded = new Set(problematic.map(p => p.contestName));
    const selected = [], contrastCounts = {};
    for (const { satisfied, rowIdx, row } of ballotScores) {
        if (!satisfied.some(c => contestsNeeded.has(c))) continue;
        selected.push({ rowIdx, row });
        for (const c of satisfied) contrastCounts[c] = (contrastCounts[c] || 0) + 1;
        for (const c of [...contestsNeeded])
            if ((contrastCounts[c] || 0) >= MIN_CONTRASTING_VOTES) contestsNeeded.delete(c);
        if (contestsNeeded.size === 0) break;
    }
    return selected;
}

function balanceUnanimity(aggregate, pool, db, log) {
    const problematic = findNearUnanimousContests(aggregate, db);
    if (problematic.length === 0) { log('  There are no near-unanimous contests.'); return; }
    for (const { contestName, maxChoice, maxVotes, totalVotes } of problematic)
        log("    '" + contestName + "': '" + maxChoice + "' has " + maxVotes + " out of " + totalVotes + " votes");
    const contrasting = findContrastingBallots(problematic, pool, db);
    if (contrasting.length > 0) {
        pool.removeRows(contrasting);
        for (const { rowIdx, row } of contrasting) aggregate.add(rowIdx, row);
        log('\n  Borrowed ' + contrasting.length + ' contrasting ballot(s).');
    }
}

// ============================================================
// Pass 2 (no contest balancing): collect the rare rows and borrow the
// minimum number of common-style ballots needed to satisfy the mandatory
// floor of minBallots total ballots (Rule a, the C.R.S. 24-72-205.5
// requirement).  Unlike the full path this deliberately skips the optional
// balancing: no per-contest minimum (Rule b) and no near-unanimity balancing
// (Rule c).  Borrowing to the floor is achieved by building the Aggregate with
// an empty rareContests set, so satisfiesMinimums() reduces to Rule a alone and
// the borrow loop pulls generic surplus ballots rather than contest-targeted
// ones.
// Returns: { redactedRowIndices, aggregateRow }
// ============================================================
function pass2CollectRareRows(file, db, index, needs, redactOnPrecinct, minBallots, log) {
    // Full-dataset row counts per privacy unit (from pass 1), used both to size
    // the borrowing need and for CommonPool's Rule d enforcement.
    const rowcountByPu = new Map();
    for (const [puKey, rowIndices] of index.rowsByPrivacyUnit)
        rowcountByPu.set(puKey, rowIndices.length);
    let rareTotal = 0;
    for (const puKey of needs.rarePairs.keys())
        rareTotal += rowcountByPu.get(puKey) || 0;
    // How many common ballots we must borrow to reach the floor.
    const gap = Math.max(0, minBallots - rareTotal);
    // At most a couple of blocked styles are ever needed as a fallback; one
    // holds minBallots ballots, always enough to cross the floor.
    const maxBlockedKeys = gap > 0 ? Math.floor(gap / minBallots) + 2 : 0;

    return new Promise((resolve, reject) => {
        const rareRows = [];
        const donorByPu = new Map();
        // Blocked styles (exactly minBallots ballots) can't donate individuals
        // without violating Rule d, but the whole style can be pulled at once as
        // a fallback when no surplus donors exist.
        const blockedByPu = new Map();
        // Count of genuinely-donatable rows loaded.  Each pair is drawn from
        // only up to its own Rule-d surplus (full_count - minBallots), so this
        // is never inflated by loading extra rows from a low-surplus pair.
        let loadedSurplus = 0;
        let fileRowCount = 0, ballotRowIdx = 0;

        Papa.parse(file, {
            skipEmptyLines: false,
            step: function(result) {
                const row = result.data;
                fileRowCount++;
                if (fileRowCount <= 4) return;
                if (isEmptyRow(row)) return;

                const currentIdx = ballotRowIdx++;
                if (ballotRowIdx % 100000 === 0)
                    log('  ' + ballotRowIdx.toLocaleString() + ' rows scanned (pass 2)...');

                const rowStyle = index.styleForRow(currentIdx);
                if (rowStyle === null) return;

                const precinct = (redactOnPrecinct && db.precinctPortionIdx !== null)
                    ? (row[db.precinctPortionIdx] || '').trim() : '';
                const puKey = index.puKeyForRow(currentIdx, rowStyle, precinct);

                if (needs.rarePairs.has(puKey)) {
                    rareRows.push({ rowIdx: currentIdx, row });
                } else if (gap > 0) {
                    const puCount = rowcountByPu.get(puKey) || 0;
                    const pairSurplus = puCount - minBallots;
                    const loadedFromPair = donorByPu.has(puKey) ? donorByPu.get(puKey).length : 0;
                    if (pairSurplus > 0 && loadedSurplus < gap && loadedFromPair < pairSurplus) {
                        // Generic donor from a common unit with surplus above the
                        // floor (Rule d safe).  No contest targeting needed since
                        // we only aim to reach the total-ballot floor.  Never load
                        // more from a pair than it can actually spare.
                        if (!donorByPu.has(puKey)) donorByPu.set(puKey, []);
                        donorByPu.get(puKey).push({ rowIdx: currentIdx, row });
                        loadedSurplus++;
                    } else if (puCount === minBallots &&
                               (blockedByPu.has(puKey) || blockedByPu.size < maxBlockedKeys)) {
                        // Reserve a whole blocked style as fallback (all its rows).
                        if (!blockedByPu.has(puKey)) blockedByPu.set(puKey, []);
                        blockedByPu.get(puKey).push({ rowIdx: currentIdx, row });
                    }
                }
            },
            complete: function() {
                if (gap === 0) {
                    // Rare ballots already meet the floor; no borrowing.
                    warnExposedContests(
                        exposedContests(rareRows, rareRows, db, minBallots), minBallots, true, log);
                    resolve({
                        redactedRowIndices: new Set(rareRows.map(b => b.rowIdx)),
                        aggregateRow: buildAggregateRow(rareRows.map(b => b.row), db, 'AGGREGATED'),
                    });
                    return;
                }

                // Borrow to the floor.  Empty rareContests => Rule a only (no b, no c).
                log('  Rare ballots: ' + rareRows.length +
                    '.  Borrowing common ballots to reach the ' + minBallots + '-ballot minimum');
                log('  (per-contest and near-unanimity balancing intentionally skipped).');
                const pool = new CommonPool(donorByPu, minBallots, rowcountByPu);
                const aggregate = new Aggregate(rareRows, new Set(), db, minBallots);
                while (aggregate.needsMoreTotalBallots()) {
                    const result = pool.bestCandidateFor(aggregate, db);
                    if (result !== null) {
                        aggregate.add(result.rowIdx, result.row);
                        pool.remove(result.key, result.idx);
                        continue;
                    }
                    // Individual borrowing stalled (no surplus donors left).  Pull
                    // a whole blocked style -- all its ballots leave the dataset
                    // together, which is Rule d safe -- as a last resort.
                    if (blockedByPu.size > 0) {
                        const [bKey, bRows] = blockedByPu.entries().next().value;
                        blockedByPu.delete(bKey);
                        for (const b of bRows) aggregate.add(b.rowIdx, b.row);
                        continue;
                    }
                    break;
                }

                if (aggregate.totalCount() < minBallots)
                    log('WARNING: could only assemble ' + aggregate.totalCount() +
                        ' ballots for the aggregate (minimum ' + minBallots +
                        '). Not enough surplus common ballots exist county-wide to reach the floor.');

                warnExposedContests(
                    exposedContests(rareRows, aggregate.ballots, db, minBallots),
                    minBallots, true, log);
                resolve({
                    redactedRowIndices: new Set(aggregate.ballots.map(b => b.rowIdx)),
                    aggregateRow: buildAggregateRow(aggregate.ballots.map(b => b.row), db, 'AGGREGATED'),
                });
            },
            error: reject,
        });
    });
}

// ============================================================
// Pass 2: stream the file to load rare rows + donors,
// then build the aggregate in memory.
// Returns: { redactedRowIndices, aggregateRow }
// ============================================================
function pass2LoadAndBuild(file, db, index, needs, minBallots, redactOnPrecinct, log) {
    const perContestPoolTarget = 10 * minBallots;

    const contestTotalCounts = {};
    for (const [puKey, rowIndices] of index.rowsByPrivacyUnit) {
        const { style } = index.parsePuKey(puKey);
        const count = rowIndices.length;
        for (let i = 0; i < db.contestNames.length; i++)
            if (style[i] === '1') {
                const cn = db.contestNames[i];
                contestTotalCounts[cn] = (contestTotalCounts[cn] || 0) + count;
            }
    }

    const rareBallotContests = new Set();
    for (const puKey of needs.rarePairs.keys()) {
        const { style } = index.parsePuKey(puKey);
        for (let i = 0; i < db.contestNames.length; i++)
            if (style[i] === '1') rareBallotContests.add(db.contestNames[i]);
    }

    const rareContests = new Set();
    for (const cn of rareBallotContests)
        if ((contestTotalCounts[cn] || 0) < perContestPoolTarget) rareContests.add(cn);

    const rowcountByPu = new Map();
    for (const [puKey, rowIndices] of index.rowsByPrivacyUnit)
        rowcountByPu.set(puKey, rowIndices.length);

    return new Promise((resolve, reject) => {
        const donorCountByContest = {}, donorVotedTally = {};
        const rareRows = [], donorByPu = new Map(), blockedByPu = new Map();
        let fileRowCount = 0, ballotRowIdx = 0;

        Papa.parse(file, {
            skipEmptyLines: false,
            step: function(result) {
                const row = result.data;
                fileRowCount++;
                if (fileRowCount <= 4) return;
                if (isEmptyRow(row)) return;

                const currentIdx = ballotRowIdx++;
                if (ballotRowIdx % 100000 === 0)
                    log('  ' + ballotRowIdx.toLocaleString() + ' rows scanned (pass 2)...');
                const rowStyle = index.styleForRow(currentIdx);
                if (rowStyle === null) return;

                const precinct = (redactOnPrecinct && db.precinctPortionIdx !== null)
                    ? (row[db.precinctPortionIdx] || '').trim() : '';
                const puKey = index.puKeyForRow(currentIdx, rowStyle, precinct);

                if (needs.rarePairs.has(puKey)) {
                    rareRows.push({ rowIdx: currentIdx, row }); return;
                }

                const puCount = rowcountByPu.get(puKey) || 0;
                if (puCount <= minBallots) {
                    if (puCount === minBallots) {
                        // Blocked style: at exactly minBallots, can't donate
                        // individual ballots without violating Rule d.  Track for
                        // potential whole-style pull if individual borrowing stalls.
                        let styleHasRareContest = false;
                        for (let i = 0; i < db.contestNames.length; i++)
                            if (rareBallotContests.has(db.contestNames[i]) && rowStyle[i] === '1') {
                                styleHasRareContest = true;
                                break;
                            }
                        if (styleHasRareContest) {
                            if (!blockedByPu.has(puKey)) blockedByPu.set(puKey, []);
                            blockedByPu.get(puKey).push({ rowIdx: currentIdx, row });
                        }
                    }
                    return;
                }

                const rowRareContests = [];
                for (const cn of rareBallotContests)
                    if (ballotHasContest(row, cn, db.contestToColumns)) rowRareContests.push(cn);
                if (rowRareContests.length === 0) return;

                if (puCount <= minBallots + DONOR_SURPLUS_THRESHOLD) {
                    if (!rowRareContests.some(cn => rareContests.has(cn))) return;
                } else {
                    const poolNeedsMore = rowRareContests.some(
                        cn => (donorCountByContest[cn] || 0) < perContestPoolTarget);
                    if (!poolNeedsMore) {
                        let needsContrast = false;
                        for (const cn of rowRareContests) {
                            const tally = donorVotedTally[cn];
                            if (!tally || !Object.keys(tally).length) continue;
                            let maxChoice = null, maxCount = -1;
                            for (const [c, n] of Object.entries(tally))
                                if (n > maxCount) { maxCount = n; maxChoice = c; }
                            let rowVoted = null;
                            for (const [s, name] of Object.entries(db.contestChoiceMeta[cn] || {}))
                                if ((row[parseInt(s)] || '').trim() === '1') { rowVoted = name; break; }
                            if (rowVoted === null || rowVoted === maxChoice) continue;
                            let cSoFar = 0;
                            for (const [c, v] of Object.entries(tally))
                                if (c !== maxChoice) cSoFar += v;
                            if (cSoFar < MIN_CONTRASTING_VOTES) { needsContrast = true; break; }
                        }
                        if (!needsContrast) return;
                    }
                }

                if (!donorByPu.has(puKey)) donorByPu.set(puKey, []);
                donorByPu.get(puKey).push({ rowIdx: currentIdx, row });
                for (const cn of rowRareContests) {
                    donorCountByContest[cn] = (donorCountByContest[cn] || 0) + 1;
                    if (!donorVotedTally[cn]) donorVotedTally[cn] = {};
                    const tally = donorVotedTally[cn];
                    for (const [s, name] of Object.entries(db.contestChoiceMeta[cn] || {}))
                        if ((row[parseInt(s)] || '').trim() === '1') {
                            tally[name] = (tally[name] || 0) + 1; break;
                        }
                }
            },
            complete: function() {
                const pool      = new CommonPool(donorByPu, minBallots, rowcountByPu, blockedByPu);
                const aggregate = buildAggregate(rareRows, rareBallotContests, pool, db, minBallots, log);

                const borrowedAfterAb = aggregate.totalCount() - rareRows.length;
                if (borrowedAfterAb > 0)
                    log('  Ballots borrowed for minimum counts: ' + borrowedAfterAb);

                log('\n*** Balancing near-unanimous contests.\n');
                let stillProblematic = [];
                while (true) {
                    const before = aggregate.totalCount();
                    balanceUnanimity(aggregate, pool, db, log);
                    stillProblematic = findNearUnanimousContests(aggregate, db);
                    if (!stillProblematic.length) break;
                    if (aggregate.totalCount() === before) break;
                }

                const unanimityBorrowed = aggregate.totalCount() - rareRows.length - borrowedAfterAb;
                if (unanimityBorrowed > 0)
                    log('  Total ballots borrowed for unanimity balancing: ' + unanimityBorrowed);

                if (stillProblematic.length > 0) {
                    log('\n  WARNING: the following contests remain near-unanimous after balancing.');
                    log('  No contrasting ballots were available in the donor pool.');
                    for (const { contestName, maxChoice, maxVotes, totalVotes } of stillProblematic)
                        log("    '" + contestName + "': '" + maxChoice + "' has " +
                            maxVotes + " out of " + totalVotes + " votes");
                }

                warnExposedContests(
                    exposedContests(rareRows, aggregate.ballots, db, minBallots),
                    minBallots, false, log);
                resolve({
                    redactedRowIndices: new Set(aggregate.ballots.map(b => b.rowIdx)),
                    aggregateRow: buildAggregateRow(aggregate.ballots.map(b => b.row), db, 'AGGREGATED'),
                });
            },
            error: reject,
        });
    });
}

// ============================================================
// Pass 3: stream the file and write output directly to
// a FileSystemWritableFileStream, one row at a time.
// No output accumulates in memory.
//
// The set-aside contests (db.setAsideColumns) are emptied on every ballot
// row, visible or redacted, and say "Redacted" in the aggregation line; if
// there is no aggregation line, one standing for no ballots is added.  The
// tally check leaves their columns out, so it checks what ships.
// ============================================================
async function pass3WriteToFile(file, db, headerRows, redactedRowIndices,
                                aggregateRow, redactOnPrecinct, writable, log,
                                dropBallotType) {
    const colsToRemove = new Set();
    if (db.countingGroupIdx   !== null) colsToRemove.add(db.countingGroupIdx);
    if (!redactOnPrecinct && db.precinctPortionIdx !== null)
        colsToRemove.add(db.precinctPortionIdx);
    if (dropBallotType && db.ballotTypeIdx !== null) colsToRemove.add(db.ballotTypeIdx);

    const blankCols = db.setAsideColumns;
    const skipCols  = new Set(blankCols);
    if (blankCols.length > 0) {
        aggregateRow = aggregateRow === null ? addedAggregateRow(db) : [...aggregateRow];
        for (const c of blankCols) aggregateRow[c] = 'Redacted';
    }

    const preTally  = new Array(db.numVoteCols).fill(0);
    const postTally = new Array(db.numVoteCols).fill(0);

    // Buffer rows and flush to disk periodically to avoid one write per row.
    const FLUSH_ROWS = 500;
    const buf = [];
    async function flush() {
        if (buf.length > 0) { await writable.write(buf.join('')); buf.length = 0; }
    }
    function writeLine(row) {
        buf.push(serializeRow(removeColumns(row, colsToRemove)) + '\r\n');
    }

    // Write the four header rows (already in memory from Pass 1).  The first
    // gets this tool's version in its first empty cell, as anonymize_cvr.py does.
    const firstRow = removeColumns(headerRows[0], colsToRemove);
    const blankAt = firstRow.indexOf('');
    if (blankAt !== -1) firstRow[blankAt] = OUR_VERSION;
    else if (firstRow.length < db.numCols - colsToRemove.size) firstRow.push(OUR_VERSION);
    buf.push(serializeRow(firstRow) + '\r\n');
    for (const row of headerRows.slice(1)) writeLine(row);
    await flush();

    let ballotRowIdx = 0;   // non-empty ballot rows seen
    function writeBallotRow(row) {
        const currentIdx = ballotRowIdx++;
        if (ballotRowIdx % 100000 === 0)
            log('  ' + ballotRowIdx.toLocaleString() + ' rows written (pass 3)...');
        addToTally(preTally, row, db.headerlen, skipCols);
        // Empty the set-aside contests first, so a redacted row gets no '*' there.
        row = emptyColumns(row, blankCols);
        if (redactedRowIndices.has(currentIdx)) {
            writeLine(redactBallotRow(row, db, redactOnPrecinct));
        } else {
            writeLine(blankGeographicFields(row, db, redactOnPrecinct));
            addToTally(postTally, row, db.headerlen, skipCols);
        }
    }

    // Stream the file for ballot rows.
    const reader  = file.stream().getReader();
    const decoder = new TextDecoder();
    let lineBuffer   = '';
    let fileLineCount = 0;   // non-empty lines seen (headers + ballot rows)

    while (true) {
        const { done, value } = await reader.read();
        lineBuffer += decoder.decode(value || new Uint8Array(), { stream: !done });

        let newlineIdx;
        while ((newlineIdx = lineBuffer.indexOf('\n')) !== -1) {
            const line = lineBuffer.substring(0, newlineIdx).replace(/\r$/, '');
            lineBuffer  = lineBuffer.substring(newlineIdx + 1);

            if (line.trim() === '') continue;   // skip blank lines, don't count
            fileLineCount++;
            if (fileLineCount <= 4) continue;   // header lines already written

            const row = parseCsvRow(line);
            if (isEmptyRow(row)) continue;   // county pre-redacted/EOF artifact rows
            writeBallotRow(row);

            if (buf.length >= FLUSH_ROWS) await flush();
        }
        if (done) break;
    }

    // Handle any remaining content (last line with no trailing newline).  It
    // goes through the same redaction as every other ballot row.
    if (lineBuffer.trim() !== '') {
        const row = parseCsvRow(lineBuffer.replace(/\r$/, ''));
        if (!isEmptyRow(row)) writeBallotRow(row);
    }

    // Append the aggregate row and verify tallies.
    if (aggregateRow !== null) {
        writeLine(aggregateRow);
        addToTally(postTally, aggregateRow, db.headerlen, skipCols);
    }
    await flush();
    await writable.close();

    if (aggregateRow !== null) {
        let mismatches = 0;
        for (let i = 0; i < db.numVoteCols; i++)
            if (Math.abs(preTally[i] - postTally[i]) > 0.001) mismatches++;
        if (mismatches > 0)
            log('WARNING: tally mismatch in ' + mismatches + ' vote column(s).');
        else
            log('  Tally verification passed.');
    }
}

// ============================================================
// Reports for contests and labels too rare to protect
// ============================================================
function reportRareContests(rare, minBallots, keepRareContests, log) {
    if (rare.size === 0) return;
    log('  Contests present on fewer than ' + minBallots + ' cards (' + rare.size +
        '); grouping ballots cannot protect them:');
    for (const [name, count] of rare) log("    '" + name + "': " + count + ' card(s)');
    if (keepRareContests) {
        log('  WARNING: "Keep rare contests" is set, so these contests are NOT redacted;');
        log('  their votes pass through the aggregation line.');
    } else {
        log('  These contests are redacted: their columns stay in the file, every cell in ' +
            'them is emptied on every ballot row, and the aggregation line says "Redacted" in them.');
        log('  ' + IMAGE_WARNING_CONTESTS);
    }
    log('');
}

function reportRareLabels(labels, minBallots, dropBallotType, log) {
    if (labels.size === 0) return;
    log('  WARNING: BallotType labels carried by fewer than ' + minBallots +
        ' ballots (' + labels.size + '):');
    for (const [label, count] of labels) log("    '" + label + "': " + count + ' ballot(s)');
    log('  A label this rare picks out the ballots that carry it, even when their ' +
        'contest pattern is common.');
    if (dropBallotType) {
        log('  The BallotType column is dropped from the output ("Drop the BallotType ' +
            'column"); these ballots are not grouped on account of the label.');
        log('  Dropping the column protects only the CVR.  ' + IMAGE_WARNING_LABELS);
    } else {
        log('  These ballots are treated as rare: grouped into the aggregate, with their ' +
            'votes starred.  The BallotType column stays; "Drop the BallotType column" ' +
            'drops it instead.');
        log('  Grouping these ballots protects only the CVR.  ' + IMAGE_WARNING_LABELS);
    }
    log('');
}

// ============================================================
// runAnonymizer — the whole run, without the page.  Used by the Run button
// and by tests/web_matches_python.js.
//
// options: { minBallots, redactOnPrecinct, noContestBalancing,
//            keepRareContests, dropBallotType }
// writable: a FileSystemWritableFileStream (write/close/abort).
// Returns true if an output was written, false if none was needed (the
// writable is then aborted).
// ============================================================
async function runAnonymizer(file, options, writable, log) {
    const { minBallots, redactOnPrecinct, noContestBalancing,
            keepRareContests, dropBallotType } = options;

    log('*** Pass 1: Looking for rare ballot styles.\n');
    const { db, headerRows, index } =
        await pass1BuildDbAndIndex(file, redactOnPrecinct, log);

    // Contests too rare to protect are set aside before rare-ballot detection.
    let rare = rareContests(index, db, minBallots);
    reportRareContests(rare, minBallots, keepRareContests, log);
    if (keepRareContests) rare = new Map();
    if (rare.size > 0) setAsideRareContests(index, db, new Set(rare.keys()));

    // Ballots carrying a rare label are made rare, unless the column is dropped.
    const rareBallotTypes = rareLabels(index.rowsByBallotType, index.skippedBallotTypeCounts,
                                       minBallots);
    reportRareLabels(rareBallotTypes, minBallots, dropBallotType, log);
    if (!dropBallotType)
        makeRareLabelRowsRare(index, 'BallotType', rareBallotTypes, index.rowsByBallotType);

    log('  ' + index.styleStrings.length + ' distinct ballot styles found.');

    const needs = checkRedactionNeeds(index, db, minBallots);
    needs.rareContests = rare;
    needs.rareLabels = rareBallotTypes;
    for (const w of needs.leakageWarnings) log('WARNING: ' + w);

    if (needs.rarePairs.size > 0) {
        const total = redactOnPrecinct ? index.rowsByPrivacyUnit.size : index.styleStrings.length;
        const label = redactOnPrecinct ? 'Rare ballot style/precinct combinations'
                                       : 'Rare ballot styles';
        log('\n  ' + label + ' (' + needs.rarePairs.size + ' of ' + total + ' total):');
        for (const [puKey, count] of [...needs.rarePairs.entries()].sort((a, b) => a[1] - b[1])) {
            const { style, precinct } = index.parsePuKey(puKey);
            const sep = precinct.indexOf(LABEL_UNIT_SEP);
            const rareLabel = sep === -1 ? '' : 'rare ' + precinct.substring(sep + 1) + ', ';
            log('    ' + count + ' ballot(s)  [' + rareLabel + 'style #' +
                index.styleStrings.indexOf(style) + ']');
        }
    }

    log(needs.needsRedaction() ? '\nRedaction is needed.' : '\nNo redaction needed.');

    const dropsAColumn = dropBallotType && db.ballotTypeIdx !== null;
    if (!needs.needsRedaction() && !dropsAColumn) {
        await writable.abort();
        log('\nDone. (No output written.)');
        return false;
    }

    let redactedRowIndices = new Set(), aggregateRow = null;
    if (needs.needsAggregate()) {
        log('\n*** Pass 2: Building the aggregate row.\n');
        if (noContestBalancing) {
            ({ redactedRowIndices, aggregateRow } = await pass2CollectRareRows(
                file, db, index, needs, redactOnPrecinct, minBallots, log));
        } else {
            ({ redactedRowIndices, aggregateRow } = await pass2LoadAndBuild(
                file, db, index, needs, minBallots, redactOnPrecinct, log));
        }

        const rareCount = [...needs.rarePairs.keys()].reduce(
            (s, k) => s + (index.rowsByPrivacyUnit.get(k) || []).length, 0);
        const borrowedCount = redactedRowIndices.size - rareCount;
        log('\n*** Pass 2 complete.');
        log('  Ballots from rare styles/precincts: ' + rareCount);
        if (borrowedCount > 0) log('  Ballots borrowed from common styles: ' + borrowedCount);
        log('  Total ballots in aggregate: ' + redactedRowIndices.size);
    } else if (rare.size > 0) {
        log('\n*** No ballot styles are rare; pass 2 is not needed.');
        log('  An aggregation line standing for no ballots will be added to mark the redacted contests.');
    }

    log('\n*** Pass 3: Writing output.');
    await pass3WriteToFile(
        file, db, headerRows, redactedRowIndices, aggregateRow,
        redactOnPrecinct, writable, log, dropBallotType);
    return true;
}

// ============================================================
// UI
// ============================================================
let selectedFile = null;

if (typeof document !== 'undefined' && document.getElementById('fileInput')) {

document.getElementById('fileInput').addEventListener('change', function(e) {
    selectedFile = e.target.files[0] || null;
    document.getElementById('runBtn').disabled = !selectedFile;
    const statusEl = document.getElementById('status');
    statusEl.textContent = '';
    statusEl.style.display = 'none';
});

document.getElementById('runBtn').addEventListener('click', async function() {
    if (!selectedFile) return;

    if (!window.showSaveFilePicker) {
        alert('This browser does not support the File System Access API.\n' +
              'Please use Chrome or Edge.');
        return;
    }

    // Open the Save As dialog immediately while we still have the user gesture.
    // The user picks the output path before processing begins.
    let fileHandle;
    try {
        fileHandle = await window.showSaveFilePicker({
            suggestedName: selectedFile.name.replace(/\.csv$/i, '_anonymized.csv'),
            types: [{ description: 'CSV file', accept: { 'text/csv': ['.csv'] } }],
        });
    } catch (e) {
        if (e.name === 'AbortError') return;   // user cancelled — do nothing
        throw e;
    }

    const options = {
        minBallots:         parseInt(document.getElementById('minBallots').value) || MIN_BALLOTS_DEFAULT,
        redactOnPrecinct:   document.getElementById('redactOnPrecinct').checked,
        noContestBalancing: document.getElementById('noContestBalancing').checked,
        keepRareContests:   document.getElementById('keepRareContests').checked,
        dropBallotType:     document.getElementById('dropBallotType').checked,
    };

    const statusEl = document.getElementById('status');
    statusEl.textContent = '';
    statusEl.style.display = 'block';

    function log(msg) {
        statusEl.textContent += msg + '\n';
        statusEl.scrollTop = statusEl.scrollHeight;
    }

    this.disabled = true;
    let writable = null;

    try {
        writable = await fileHandle.createWritable();
        const wrote = await runAnonymizer(selectedFile, options, writable, log);
        writable = null;   // runAnonymizer closed or aborted it
        if (wrote) {
            log('  Output written to ' + fileHandle.name + '.');
            log('\nDone.');
        }
    } catch (err) {
        log('\nError: ' + err.message);
        console.error(err);
        if (writable) { try { await writable.abort(); } catch (_) {} }
    } finally {
        this.disabled = false;
    }
});

}
