name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: setup-python has no Python 3.9 build for the newer ubuntu-latest images.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test cases
        run: python run_tests.py

  windows:
    # The tests on Windows, then the wheel built and installed there: checks that the
    # anonymize_cvr and anonymize_cvr_gui commands are created and that anonymize_cvr runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the test cases
        run: python run_tests.py
      - name: Build and install the wheel
        shell: pwsh
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --outdir wheel
          python -m pip install (Get-ChildItem wheel/*.whl).FullName
      - name: Check the installed commands
        shell: pwsh
        run: |
          Get-Command anonymize_cvr, anonymize_cvr_gui | Format-Table Name, Source
          anonymize_cvr --version
          anonymize_cvr --help | Select-Object -First 3

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Pinned so a new release of either tool can't fail the build on its own.
      - name: Install mypy and black
        run: pip install mypy==1.17.1 black==26.5.1
      - name: mypy
        run: mypy anonymize_cvr.py verify_redaction.py run_tests.py generate_test_cvrs.py
      - name: black
        run: black --check anonymize_cvr.py verify_redaction.py run_tests.py generate_test_cvrs.py
