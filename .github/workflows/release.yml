# Release workflow: see docs/RELEASE.md.
#
# A trial run (a push to the branch release-trial, or "Run workflow" on the Actions page) does the
# same tests, build and attestations under a trial version X.Y.Z.devN (N = the run number), and
# publishes the wheel to TestPyPI instead, after a maintainer approves the "testpypi" environment.
# It makes no GitHub Release and touches nothing on PyPI.
#
# Runs when a maintainer pushes a tag vX.Y.Z on main. It tests, builds the wheel and the release
# files, attests each file (build provenance in Sigstore's public log), publishes the wheel to
# PyPI through trusted publishing once a maintainer approves the "pypi" environment, and creates a
# draft GitHub Release. A maintainer then signs SHA256SUMS with Sigstore, adds the signature to
# the draft, and publishes it.
#
# No secret or token is used anywhere: PyPI accepts the upload only from this workflow, in this
# repository, in the "pypi" environment. Every action is pinned to a full commit SHA (with its
# version in a comment) so a changed tag upstream cannot change what runs here.

name: Release

on:
  push:
    tags: ["v*.*.*"]
    branches: [release-trial]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test cases
        run: python run_tests.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # to sign the build provenance
      attestations: write # to record it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check that the tag is on main and matches the version in both tools
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          want="${TAG#v}"
          py=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' anonymize_cvr.py)
          html=$(sed -n "s/^const VERSION = '\(.*\)';.*/\1/p" anonymize_cvr.html)
          echo "tag $want, anonymize_cvr.py $py, anonymize_cvr.html $html"
          [ "$py" = "$want" ] && [ "$html" = "$want" ] \
            || { echo "::error::version mismatch"; exit 1; }

      - name: For a trial run, check both tools agree and mark the version X.Y.Z.devN
        if: github.ref_type != 'tag'
        run: |
          py=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' anonymize_cvr.py)
          html=$(sed -n "s/^const VERSION = '\(.*\)';.*/\1/p" anonymize_cvr.html)
          echo "anonymize_cvr.py $py, anonymize_cvr.html $html"
          [ "$py" = "$html" ] || { echo "::error::version mismatch"; exit 1; }
          trial="$py.dev$GITHUB_RUN_NUMBER"
          sed -i "s/^VERSION = \".*\"$/VERSION = \"$trial\"/" anonymize_cvr.py
          sed -i "s/^const VERSION = '.*';/const VERSION = '$trial';/" anonymize_cvr.html
          echo "trial version $trial"

      - name: Build the wheel (reproducibly, from the commit's time)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m pip install build==1.6.1
          python -m build --wheel --outdir wheel/
          ls -l wheel/

      - name: Gather the release files and their hashes
        run: |
          mkdir release
          cp anonymize_cvr.py anonymize_cvr.html verify_redaction.py wheel/*.whl release/
          cd release
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Check the wheel holds the same anonymize_cvr.py as the release
        run: |
          python - <<'EOF'
          import glob, hashlib, zipfile
          whl = glob.glob("wheel/*.whl")[0]
          with zipfile.ZipFile(whl) as z:
              names = sorted(n for n in z.namelist() if not n.endswith("/"))
              print("\n".join(names))
              for f in ("anonymize_cvr.py", "verify_redaction.py"):
                  inside = hashlib.sha256(z.read(f)).hexdigest()
                  outside = hashlib.sha256(open(f, "rb").read()).hexdigest()
                  assert inside == outside, f"{f} in the wheel differs from the source"
          extra = [n for n in names if not n.startswith(("anonymize_cvr.py", "verify_redaction.py", "anonymize_cvr-"))]
          assert not extra, f"unexpected files in the wheel: {extra}"
          EOF

      - name: Attest the build provenance of each file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/anonymize_cvr.py
            release/anonymize_cvr.html
            release/verify_redaction.py
            release/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: wheel/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    # The "testpypi" environment requires a maintainer's approval, and it is the environment named
    # in TestPyPI's trusted publisher for anonymize_cvr.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/anonymize_cvr/
    permissions:
      id-token: write # for trusted publishing and TestPyPI's attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: wheel/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheel/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # The "pypi" environment requires a maintainer's approval before this job runs, and it is the
    # environment named in PyPI's trusted publisher for anonymize_cvr.
    environment:
      name: pypi
      url: https://pypi.org/project/anonymize_cvr/
    permissions:
      id-token: write # for trusted publishing and PyPI's attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: wheel/
      # Wheel only, never a source package: installing a wheel runs no code.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheel/

  draft-release:
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - name: Create a draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "anonymize_cvr ${TAG#v}" \
            --notes "Draft. Before publishing: check SHA256SUMS, sign it with Sigstore (docs/RELEASE.md), add SHA256SUMS.sigstore.json, and replace these notes with the release notes."
